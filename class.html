<!DOCTYPE html>
<html>

<head>
    <!--We use a class to group similar HTML elements together so that we can style or control them all at once.-->
    <title>Classes</title>
</head>

<body>

    <h1 class="heading">Welcome to My Webpage</h1>

    <p class="intro">
        Hello! My name is Raima. I am learning HTML.
    </p>

    <h2 class="heading">My Hobbies</h2>

    <p class="text">
        I like programming and reading books.
    </p>

    <h2 class="heading">My Favorite Subjects</h2>

    <ul class="subjects">
        <li>Computer Science</li>
        <li>Mathematics</li>
        <li>English</li>
    </ul>

    <h2 class="heading">My Goal</h2>

    <p class="text">
        I want to become a successful programmer and create useful websites and applications.
    </p>

</body>

</html>
