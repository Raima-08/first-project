<html>
<head> 
    <title> Tables</title>
</head>
<body>
    <table>
  <tr>
    <th>Subject</th>
    <th>Marks</th>
  </tr>

  <tr>
    <td>English</td>
    <td>85</td>
  </tr>

  <tr>
    <td>Maths</td>
    <td>90</td>
  </tr>
</table>

<table border="1">
  <tr>
    <th>Subject</th>
    <th>Marks</th>
  </tr>
  <tr>
    <td>English</td>
    <td>85</td>
  </tr>
  <tr>
    <td>Maths</td>
    <td>90</td>
  </tr>
</table>

<table border="1">
  <caption>My Exam Marks</caption>
  <tr>
    <th>Subject</th>
    <th>Marks</th>
  </tr>
  <tr>
    <td>Maths</td>
    <td>90</td>
  </tr>
</table>


<table border="1">
  <caption>My Marks</caption>

  <thead>
    <tr>
      <th>Subject</th>
      <th>Marks</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>English</td>
      <td>85</td>
    </tr>
    <tr>
      <td>Maths</td>
      <td>90</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td>Total</td>
      <td>175</td>
    </tr>
  </tfoot>
</table>



<table border="1">
  <tr>
    <th colspan="2">Student Marks</th>
  </tr>
  <tr>
    <th>Subject</th>
    <th>Marks</th>
  </tr>
  <tr>
    <td>Computer</td>
    <td>100</td>
  </tr>
</table>


<table border="1">
  <tr>
    <th>Student</th>
    <th>Subject</th>
  </tr>
  <tr>
    <td rowspan="2">Raima</td>
    <td>English</td>
  </tr>
  <tr>
    <td>Maths</td>
  </tr>
</table>
</body>
</html>
